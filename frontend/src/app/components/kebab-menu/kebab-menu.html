<div class="kebab-host" #host>
  <button
    #triggerBtn
    type="button"
    class="kebab-trigger"
    [class]="buttonClass()"
    [attr.aria-label]="label()"
    [attr.aria-haspopup]="'menu'"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()">
    <i class="ti ti-dots-vertical" aria-hidden="true"></i>
  </button>

  @if (isOpen()) {
    <ul
      #menuEl
      class="kebab-dropdown"
      role="menu"
      [attr.aria-label]="label()">
      @for (item of items(); track item.id; let i = $index) {
        <li
          class="kebab-item"
          [class.kebab-item-active]="item.active"
          [class.kebab-item-destructive]="item.variant === 'destructive'"
          [class.kebab-item-disabled]="item.disabled"
          role="menuitem"
          [id]="'kebab-item-' + i"
          [attr.data-index]="i"
          [attr.tabindex]="-1"
          [attr.aria-disabled]="item.disabled ? true : null"
          [attr.title]="item.disabled && item.disabledTooltip ? item.disabledTooltip : null"
          [attr.aria-label]="item.ariaLabel ?? null"
          (click)="selectItem(item)">
          @if (item.icon) {
            <i class="ti {{ item.icon }}" aria-hidden="true"></i>
          }
          <span>{{ item.label }}</span>
        </li>
      }
    </ul>
  }
</div>
