<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card confirm-card" (click)="$event.stopPropagation()" role="alertdialog" aria-modal="true">
    <h2 class="confirm-title">{{ title() }}</h2>
    <p class="confirm-message">{{ message() }}</p>
    <div class="confirm-actions">
      <button
        type="button"
        class="btn-secondary"
        (click)="onCancel()">
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        [class]="'btn-primary ' + (variant() === 'danger' ? 'btn-danger' : '')"
        (click)="onConfirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
