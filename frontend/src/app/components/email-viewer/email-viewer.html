<div class="viewer-card">
  <app-email-viewer-header
    [email]="email()"
    [userRole]="userRole()"
    [canMarkImportant]="userRole() !== 'TRIAL'"
    [isImportant]="email().isImportant"
    [hasReminder]="!!reminder()"
    [hasPendingReminder]="reminder()?.done === false"
    (action)="action.emit($event)" />
  <app-email-analysis
    [analysis]="analysis()"
    [state]="state()"
    [accessibilityMode]="accessibilityMode()"
    [canMarkImportant]="userRole() !== 'TRIAL'"
    [isImportant]="email().isImportant"
    [userRole]="userRole()"
    [trialRemaining]="null"
    [hasReminder]="!!reminder()"
    [hasPendingReminder]="reminder()?.done === false"
    [(open)]="analysisPanelOpen"
    (retry)="retry.emit()"
    (analyzeRequest)="analyzeRequest.emit()" />
  <div class="viewer-subject">
    <h2>{{ email().subject }}</h2>
  </div>
  @if (reminder(); as r) {
    <div class="viewer-reminder">
      <app-reminder-indicator
        [reminder]="r"
        variant="banner"
        (action)="reminderAction.emit($event)" />
    </div>
  }
  <div class="viewer-body">
    <app-email-body
      [htmlContent]="email().htmlContent"
      [contentForAnalysis]="email().contentForAnalysis" />
  </div>
</div>
