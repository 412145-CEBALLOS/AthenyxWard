<div class="viewer-card">
  <app-email-viewer-header [email]="email()" />
  <app-email-analysis
    [analysis]="analysis()"
    [state]="state()"
    [accessibilityMode]="accessibilityMode()"
    [canMarkImportant]="canMarkImportant()"
    [isImportant]="isImportant()"
    [userRole]="userRole()"
    [trialRemaining]="null"
    [hasReminder]="hasReminder()"
    [hasPendingReminder]="hasPendingReminder()"
    [(open)]="analysisPanelOpen"
    (hide)="hide.emit()"
    (delete)="delete.emit()"
    (markPhishing)="markPhishing.emit()"
    (markImportant)="markImportant.emit()"
    (createReminder)="createReminder.emit()"
    (retry)="retry.emit()"
    (analyzeRequest)="analyzeRequest.emit()" />
  <div class="viewer-subject">
    <h2>{{ email().subject }}</h2>
  </div>
  @if (reminder(); as r) {
    <div class="viewer-reminder">
      <app-reminder-indicator
        [reminder]="r"
        variant="banner"
        (action)="reminderAction.emit($event)" />
    </div>
  }
  <div class="viewer-body">
    <app-email-body
      [htmlContent]="email().htmlContent"
      [contentForAnalysis]="email().contentForAnalysis" />
  </div>
</div>
