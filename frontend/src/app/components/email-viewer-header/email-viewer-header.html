<div class="viewer-header">
  <app-sender-avatar
    size="lg"
    [sender]="email().sender"
    [senderName]="email().senderName" />
  <div class="viewer-meta">
    <div class="viewer-from-row">
      <h3>{{ email().senderName || email().sender }}</h3>
      <span class="viewer-email">&lt;{{ email().sender }}&gt;</span>
    </div>
    <div class="viewer-date-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      {{ email() | emailDate }}
    </div>
  </div>
  <button
    type="button"
    class="ai-explain-btn"
    [disabled]="aiButtonDisabled()"
    [attr.title]="aiButtonDisabledTooltip()"
    (click)="onAiButtonClick()"
    aria-label="Explicar con IA">
    <i class="ti ti-robot" aria-hidden="true"></i>
  </button>
  <app-kebab-menu
    [items]="items()"
    [label]="'Acciones del correo'"
    (action)="onAction($event)" />
</div>
