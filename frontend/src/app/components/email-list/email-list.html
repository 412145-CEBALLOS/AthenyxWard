<ul class="email-list">
  @for (email of emails(); track email.gmailId) {
    <app-email-item
      [email]="email"
      [selected]="selectedGmailId() === email.gmailId"
      [accessibilityMode]="accessibilityMode()"
      [reminder]="reminderFor(email.id)"
      (select)="select.emit($event)"
      (reminderAction)="reminderAction.emit($event)" />
  }
</ul>
