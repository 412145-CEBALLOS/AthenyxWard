<app-page-shell
  icon="ti ti-history"
  title="Historial de análisis"
  subtitle="Revisa los correos analizados recientemente y su nivel de riesgo.">

  <ul class="history-list">
    @for (entry of entries(); track entry.id) {
      <li class="history-card" [attr.data-level]="entry.level">
        <div class="history-bar"></div>
        <div class="history-body">
          <div class="history-top-row">
            <span class="history-sender">{{ entry.sender }}</span>
            <span class="history-date">{{ entry.date }}</span>
          </div>
          <span class="history-subject">{{ entry.subject }}</span>
          <p class="history-summary">{{ entry.summary }}</p>
          <div class="history-footer">
            <span class="risk-badge" [attr.data-level]="entry.level">
              {{ levelLabel(entry.level) }} · {{ entry.risk }}%
            </span>
          </div>
        </div>
      </li>
    }
  </ul>
</app-page-shell>
