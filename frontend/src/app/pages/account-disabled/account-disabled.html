<div class="disabled-container">
  <div class="disabled-bg-elements">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <div class="disabled-card">
    <div class="card-glow"></div>
    <div class="icon-section">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="7" r="4" stroke="#ef4444" stroke-width="2"/>
        <line x1="17" y1="11" x2="23" y2="17" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
        <line x1="23" y1="11" x2="17" y2="17" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="disabled-title">Tu cuenta ha sido desactivada</h1>
    <p class="disabled-message">
      Si crees que esto es un error, contacta al administrador de la plataforma en
      <a [href]="'mailto:' + supportEmail" class="support-link">{{ supportEmail }}</a>.
    </p>
    <button class="login-btn" (click)="goToLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Volver al inicio de sesión
    </button>
  </div>

  <p class="disabled-footer">Athenyx Ward © 2026</p>
</div>
