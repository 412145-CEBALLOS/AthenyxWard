<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Athenyx Ward</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="icono.jpg">
  <script>
    (function() {
      var v = localStorage.getItem('athenyx.theme');
      if (v === 'light' || v === 'dark') {
        document.documentElement.setAttribute('data-theme', v);
      }
    })();
  </script>
  <script>
    (function() {
      var v = localStorage.getItem('athenyx.accessibility-mode');
      // Accessibility mode is enabled by default.
      if (v !== 'false') {
        document.documentElement.classList.add('accessibility-mode');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
