spring.application.name=athenyx-ward

spring.config.import=optional:dotenv:.env

server.port=8080

# Force HTTPS (set to true in production only). Trust X-Forwarded-Proto when behind a reverse proxy.
server.force-https=false
server.forward-headers-strategy=framework

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/athenyx_ward?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson serialization — dates as ISO-8601 UTC strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send
# Pin the redirect URI to the frontend host so cookies land on the right origin
# (the Angular dev-server proxy does not inject X-Forwarded-Host headers).
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.redirect-uri=${app.oauth2.redirect-uri}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.jwt.refresh-absolute-expiration-ms=${JWT_REFRESH_ABSOLUTE_EXPIRATION_MS:7776000000}

# Refresh token cookie
app.auth.refresh-cookie-name=${AUTH_REFRESH_COOKIE_NAME:athenyx_refresh}
app.auth.refresh-cookie-path=${AUTH_REFRESH_COOKIE_PATH:/}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Frontend URL (CORS)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Spring AI - Ollama (Sprint 3)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:7b-instruct}
spring.ai.ollama.chat.enabled=${OLLAMA_ENABLED:true}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.2}
spring.ai.ollama.chat.options.num-predict=${OLLAMA_NUM_PREDICT:1000}
spring.ai.ollama.chat.options.timeout=${OLLAMA_TIMEOUT:25s}

# Audit log
app.audit.retention-days=${AUDIT_RETENTION_DAYS:365}

# Caffeine cache (60s TTL for app_config)
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s
