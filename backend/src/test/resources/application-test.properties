spring.datasource.url=jdbc:h2:mem:reminder_it;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret-test-secret
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000
app.jwt.refresh-absolute-expiration-ms=7776000000
app.auth.refresh-cookie-name=athenyx_refresh
app.auth.refresh-cookie-path=/
app.auth.cookie-secure=false
app.frontend.url=http://localhost:4200
app.oauth2.redirect-uri=http://localhost:4200/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.enabled=false
